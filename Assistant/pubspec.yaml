name: assistant
description: Offline personal finance and todo manager (local SQLite database).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  provider: ^6.1.2
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  local_auth: ^2.3.0
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  file_picker: ^10.1.9
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
